<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 278" role="img" aria-labelledby="title desc">
<title id="title">ST3D 1.1 的二维观测、时序重建与迭代修正</title>
<desc id="desc">二维球点与十三个球场点、局部图像和裁剪信息分别编码，相加为逐帧特征。四层注意力和坐标回归产生初始球路，重投影修正器重复五轮输出完整三维轨迹。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#557982"/></marker></defs>
<style>text{font-family:system-ui,'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#183744}.t{font-weight:700;font-size:17px}.s{font-size:14px;fill:#405d68}.k{font-size:13px;font-weight:700;fill:#17665d}.edge{fill:none;stroke:#557982;stroke-width:1.7;marker-end:url(#arrow)}.input{fill:#f4f8f9;stroke:#bbd0d4}.model{fill:#eaf4ef;stroke:#8eb8a9}.refine{fill:#eef4fa;stroke:#9bb4c8}</style>
<text x="12" y="22" class="k">逐帧观测</text><text x="255" y="22" class="k">特征编码</text><text x="503" y="22" class="k">时序重建网络</text><text x="858" y="22" class="k">空间修正网络</text>
<g class="input"><rect x="12" y="39" width="195" height="51" rx="7"/><rect x="12" y="104" width="195" height="51" rx="7"/><rect x="12" y="169" width="195" height="51" rx="7"/></g>
<g class="s"><text x="28" y="71">球点、13 个球场点</text><text x="28" y="135">24 × 24 球图像与热图</text><text x="28" y="200">图像裁剪中心与尺度</text></g>
<g class="edge"><path d="M207 65H247"/><path d="M207 130H247"/><path d="M207 195H247"/></g>
<g class="input"><rect x="255" y="39" width="148" height="51" rx="7"/><rect x="255" y="104" width="148" height="51" rx="7"/><rect x="255" y="169" width="148" height="51" rx="7"/></g>
<g class="s"><text x="270" y="71">坐标编码</text><text x="270" y="135">三层卷积</text><text x="270" y="200">线性映射</text></g>
<g fill="none" stroke="#557982" stroke-width="1.7"><path d="M403 65H434V130M403 195H434V130M403 130H446"/></g><circle cx="460" cy="130" r="14" fill="white" stroke="#557982"/><text x="452" y="136" font-size="20">+</text><path class="edge" d="M474 130H495"/>
<rect class="model" x="503" y="39" width="291" height="181" rx="9"/><text x="520" y="68" class="t">4 层 Transformer</text><text x="520" y="96" class="s">逐帧 192 维 · 每层 6 个注意力头</text>
<rect x="520" y="112" width="121" height="39" rx="5" fill="#fff"/><rect x="650" y="112" width="126" height="39" rx="5" fill="#fff"/><text x="528" y="136" class="s">2 层 · 192 帧</text><text x="660" y="136" class="s">2 层 · 整回合</text>
<text x="520" y="189" class="s">位置回归 → 每帧初始 (X, Y, Z)</text>
<path class="edge" d="M794 130H850"/><rect class="refine" x="858" y="39" width="288" height="181" rx="9"/>
<text x="875" y="68" class="t">重投影修正 × 5</text><text x="875" y="97" class="s">估计球路投回相机画面</text><text x="875" y="125" class="s">比较投影点与实际检测点</text><text x="875" y="153" class="s">时序卷积 + 全局注意力</text><text x="875" y="187" class="s">更新逐帧三维位置</text><path class="edge" d="M1065 187H1123V92H1085"/>
<path class="edge" d="M1000 220V244"/><text x="918" y="267" class="k">完整回合的三维球路（米）</text>
</svg>
