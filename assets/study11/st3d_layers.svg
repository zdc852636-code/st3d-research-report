<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 650" role="img"><title>ST3D 主网络与共享权重修正器的网络详图</title><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#203b49}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#536b78" /></marker></defs><rect width="100%" height="100%" fill="white" /><text x="30" y="54" font-size="30" font-weight="700">ST3D 单目羽毛球三维轨迹重建</text><text x="30" y="96" font-size="23" font-weight="700">主网络推理</text><text x="222" y="96" font-size="17" font-weight="400">1,929,971 个参数</text><text x="30" y="369" font-size="23" font-weight="700">共享权重的空间修正网络</text><text x="382" y="369" font-size="17" font-weight="400">14,888 个参数</text><text x="648" y="282" font-size="17" font-weight="400">每帧 192 维 · 每层 6 个注意力头</text><text x="30" y="412" font-size="18" font-weight="400">以主网络输出 X₀ 为起点，每轮根据当前轨迹重新计算投影偏差。</text><text x="495" y="604" font-size="20" font-weight="400">同一组权重迭代 5 轮 · 输出 X₅</text><text x="30" y="639" font-size="16" font-weight="400">T 为整回合帧数。网络对每帧输出一个球场坐标 (X, Y, Z)，单位为米。</text><rect x="30" y="124" width="269" height="40" rx="7" fill="#f6f8fa" stroke="#9cabb4" /><text x="164.5" y="150.0" font-size="17" text-anchor="middle">球心、13 个场地点与时间</text><rect x="348" y="124" width="150" height="40" rx="7" fill="#e8f2fa" stroke="#6385a0" /><text x="423.0" y="150.0" font-size="17" text-anchor="middle">坐标编码</text><rect x="30" y="184" width="269" height="40" rx="7" fill="#f6f8fa" stroke="#9cabb4" /><text x="164.5" y="210.0" font-size="17" text-anchor="middle">灰度小图 + 热图 · 2 × 24 × 24</text><rect x="348" y="184" width="150" height="40" rx="7" fill="#e8f2fa" stroke="#6385a0" /><text x="423.0" y="210.0" font-size="17" text-anchor="middle">三层二维卷积</text><rect x="30" y="244" width="269" height="40" rx="7" fill="#f6f8fa" stroke="#9cabb4" /><text x="164.5" y="270.0" font-size="17" text-anchor="middle">裁剪中心与尺度 · 3 维</text><rect x="348" y="244" width="150" height="40" rx="7" fill="#e8f2fa" stroke="#6385a0" /><text x="423.0" y="270.0" font-size="17" text-anchor="middle">线性映射</text><ellipse cx="572.0" cy="204.0" rx="19.0" ry="19.0" fill="#fff" stroke="#617782" /><text x="572.0" y="210.0" font-size="17" text-anchor="middle">+</text><rect x="645" y="164" width="208" height="80" rx="7" fill="#dceee8" stroke="#568e85" /><text x="749.0" y="198.5" font-size="17" text-anchor="middle">局部注意力 × 2</text><text x="749.0" y="221.5" font-size="17" text-anchor="middle">192 帧窗口</text><rect x="908" y="164" width="187" height="80" rx="7" fill="#dceee8" stroke="#568e85" /><text x="1001.5" y="198.5" font-size="17" text-anchor="middle">全局注意力 × 2</text><text x="1001.5" y="221.5" font-size="17" text-anchor="middle">整回合上下文</text><rect x="1155" y="164" width="235" height="80" rx="7" fill="#dfedf7" stroke="#698aa4" /><text x="1272.5" y="198.5" font-size="17" text-anchor="middle">逐帧位置回归</text><text x="1272.5" y="221.5" font-size="17" text-anchor="middle">三维初值 X₀ · T × 3</text><rect x="30" y="445" width="252" height="74" rx="7" fill="#edf0fa" stroke="#8e99b5" /><text x="156.0" y="476.5" font-size="17" text-anchor="middle">三维轨迹投回相机</text><text x="156.0" y="499.5" font-size="17" text-anchor="middle">检测球点 − 投影球点</text><rect x="330" y="445" width="198" height="74" rx="7" fill="#edf0fa" stroke="#8e99b5" /><text x="429.0" y="476.5" font-size="17" text-anchor="middle">31 维观测与运动特征</text><text x="429.0" y="499.5" font-size="17" text-anchor="middle">线性映射 → 32 维</text><rect x="575" y="445" width="210" height="74" rx="7" fill="#edf0fa" stroke="#8e99b5" /><text x="680.0" y="476.5" font-size="17" text-anchor="middle">一维时序卷积 · 核 5</text><text x="680.0" y="499.5" font-size="17" text-anchor="middle">空洞卷积 · 核 3，膨胀 4</text><rect x="833" y="445" width="205" height="74" rx="7" fill="#edf0fa" stroke="#8e99b5" /><text x="935.5" y="476.5" font-size="17" text-anchor="middle">每 16 帧汇总</text><text x="935.5" y="499.5" font-size="17" text-anchor="middle">4 头全局注意力</text><rect x="1085" y="445" width="305" height="74" rx="7" fill="#edf0fa" stroke="#8e99b5" /><text x="1237.5" y="476.5" font-size="17" text-anchor="middle">融合逐帧特征并更新位置</text><text x="1237.5" y="499.5" font-size="17" text-anchor="middle">Xₖ → Xₖ₊₁</text><polyline points="299,144 348,144" fill="none" stroke="#536b78" stroke-width="1.6" marker-end="url(#arr)" /><polyline points="299,204 348,204" fill="none" stroke="#536b78" stroke-width="1.6" marker-end="url(#arr)" /><polyline points="299,264 348,264" fill="none" stroke="#536b78" stroke-width="1.6" marker-end="url(#arr)" /><polyline points="498,144 572,144 572,185" fill="none" stroke="#536b78" stroke-width="1.6" marker-end="url(#arr)" /><polyline points="498,204 553,204" fill="none" stroke="#536b78" stroke-width="1.6" marker-end="url(#arr)" /><polyline points="498,264 572,264 572,223" fill="none" stroke="#536b78" stroke-width="1.6" marker-end="url(#arr)" /><polyline points="591,204 645,204" fill="none" stroke="#536b78" stroke-width="1.6" marker-end="url(#arr)" /><polyline points="853,204 908,204" fill="none" stroke="#536b78" stroke-width="1.6" marker-end="url(#arr)" /><polyline points="1095,204 1155,204" fill="none" stroke="#536b78" stroke-width="1.6" marker-end="url(#arr)" /><polyline points="282,482.0 330,482.0" fill="none" stroke="#536b78" stroke-width="1.6" marker-end="url(#arr)" /><polyline points="528,482.0 575,482.0" fill="none" stroke="#536b78" stroke-width="1.6" marker-end="url(#arr)" /><polyline points="785,482.0 833,482.0" fill="none" stroke="#536b78" stroke-width="1.6" marker-end="url(#arr)" /><polyline points="1038,482.0 1085,482.0" fill="none" stroke="#536b78" stroke-width="1.6" marker-end="url(#arr)" /><polyline points="1237,519 1237,565 156,565 156,519" fill="none" stroke="#536b78" stroke-width="1.6" marker-end="url(#arr)" /></svg>